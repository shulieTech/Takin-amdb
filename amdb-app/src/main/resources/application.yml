server:
  port: 10032
  servlet:
    context-path: /
  undertow:
    enabled: true
    io-threads: 8
    worker-threads: 32
    max-connections: 1000
    connection-timeout: 30000
    no-request-timeout: 30000
    max-buffered-request-size: 16384
    buffer-pipelined-data: true
    buffer-pool: default
    response-headers: true
    keep-alive: true
    tcp-no-delay: true
    max-concurrent-requests: 2048
    task-queue-size: 512
    max-headers: 2000
    max-header-size: 20480
    non-blocking: true
spring:
  servlet:
    multipart:
      max-file-size: 102400KB
      max-request-size: 102400KB
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.1.221:3306/amdb?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowMultiQueries=true&serverTimezone=GMT%2B8
    username: root
    password: shulie@2020
    druid:
      initialSize: 1
      minIdle: 3
      maxActive: 20
      maxWait: 60000
      timeBetweenEvictionRunsMillis: 60000
      minEvictableIdleTimeMillis: 30000
      validationQuery: select 'x'
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      poolPreparedStatements: true
      maxPoolPreparedStatementPerConnectionSize: 20
      filters: stat,wall,slf4j
      connectionProperties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000

tro:
